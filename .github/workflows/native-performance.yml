name: Native performance tooling

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.96.1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install build and display dependencies
        run: |
          npm ci
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: performance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: Verify report contracts and ordinary frontend probe exclusion
        run: |
          node --test scripts/performance-report.test.mjs
          npm run build
          node --input-type=module -e '
            import { readdirSync, readFileSync } from "node:fs";
            for (const file of readdirSync("apps/desktop/dist", { recursive: true }).filter(f => f.endsWith(".js"))) {
              if (/native-validation-ready|native-validation-smoke/.test(readFileSync(`apps/desktop/dist/${file}`, "utf8"))) throw new Error("Ordinary frontend contains validation probes");
            }
          '
      - name: Build and install instrumented package (never publish this installer)
        env:
          VITE_NATIVE_VALIDATION: '1'
          NIMBLEPOST_BUILD_SHA: ${{ github.sha }}
        run: |
          npm run tauri --workspace @nimblepost/desktop -- build --ci --features native-validation -- --locked
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
      - name: Measure two independent series on the same host
        run: |
          mkdir -p reports/native-performance
          for series in reference candidate; do
            dbus-run-session -- xvfb-run -a node scripts/native-performance.mjs run \
              --binary /usr/bin/NimblePost --launches 5 \
              --conditions 'GitHub Ubuntu x64; Xvfb; provider-managed power; host load unknown; no concurrent builds in job' \
              --out "reports/native-performance/$series.json" \
              2>&1 | tee "reports/native-performance/$series.log"
          done
      - name: Compare tooling series (not a release gate)
        run: |
          set +e
          node scripts/native-performance.mjs compare \
            --reference reports/native-performance/reference.json \
            --candidate reports/native-performance/candidate.json \
            --tooling-check true --out reports/native-performance/comparison.json
          result=$?
          set -e
          test "$result" -ne 1 && test "$result" -le 3
      - name: Preserve complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-performance-linux-${{ github.sha }}
          path: reports/native-performance/
          retention-days: 30
          if-no-files-found: warn
