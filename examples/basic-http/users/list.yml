# Preserve this comment and the quoting when editing another field.
info:
  name: List Users
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/users"
  headers:
    - name: X-Example
      value: 'preserve this quoting'
      disabled: true
  params:
    - name: limit
      value: "{{pageSize}}"
      type: query
runtime:
  variables:
    - name: pageSize
      value:
        type: string
        data: "5"
settings:
  timeout: inherit
docs: |
  The request value (5) takes precedence over the folder default (10).
