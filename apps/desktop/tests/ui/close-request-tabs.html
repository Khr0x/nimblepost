<!doctype html><html lang="en"><meta charset="UTF-8"><div id="app"></div><script type="module">
// Run with desktop Vite: http://127.0.0.1:1420/tests/ui/close-request-tabs.html
// Exercises the real UI with in-memory Tauri storage; no files are written.
import { mockIPC } from '@tauri-apps/api/mocks';
const collection={name:'Team API',root:'/tmp/close-tabs-test',requests:['saved.yml'],folders:['users'],environments:[],readOnly:false};
const documents={'saved.yml':{info:{name:'Saved request',type:'http'},http:{method:'GET',url:'https://api.example.com/original'}}};
let revision=0, writes=0, failSave=false;
const snapshots=new Map();
function view(path){const document=structuredClone(documents[path]);const id=++revision;snapshots.set(id,path);return {name:document.info.name,method:document.http.method,url:document.http.url,revision:id,document,diagnostics:[]};}
function apply(document,edits){for(const edit of edits){let target=document;for(const part of edit.path.slice(0,-1))target=target[part]??={};const key=edit.path.at(-1);if(edit.value===null){if(Array.isArray(target))target.splice(Number(key),1);else delete target[key];}else target[key]=JSON.parse(JSON.stringify(edit.value));}}
mockIPC((cmd,args)=>{
 if(cmd==='read_workspace')return {workspaces:[{id:1,name:'My Workspace'}],activeWorkspaceId:1,activeCollection:collection.root,collections:[collection],warning:null};
 if(cmd==='read_history')return {entries:[],warning:null};
 if(cmd==='read_request_summaries')return Object.fromEntries(collection.requests.map(path=>[path,{name:documents[path].info.name,method:'GET'}]));
 if(cmd==='read_request')return view(args.path);
 if(cmd==='select_collection')return collection;
 if(cmd==='save_document'){if(failSave){failSave=false;throw new Error('Disk is temporarily unavailable.');}const path=snapshots.get(args.input.revision);if(!path)throw new Error('Unknown revision');apply(documents[path],args.input.edits);writes++;return view(path);}
 if(cmd==='create_request'){if(args.input.name==='Rejected')throw new Error('That filename already exists.');const path=`${args.input.folder?args.input.folder+'/':''}${args.input.name}.yml`;documents[path]={info:{name:args.input.name,type:'http'},http:{method:args.input.method,url:args.input.url}};apply(documents[path],args.input.edits);documents[path].info.name=args.input.name;collection.requests.push(path);writes++;return {collection,path,request:view(path)};}
 throw new Error(`Unexpected command ${cmd}`);
});
await import('/src/main.ts');
const assert=(condition,message)=>{if(!condition)throw new Error(message);};
async function until(predicate){const deadline=Date.now()+5000;while(!predicate()){if(Date.now()>deadline)throw new Error('UI did not reach expected state');await new Promise(requestAnimationFrame);}}
const button=name=>[...document.querySelectorAll('[role="dialog"][data-state="open"] button'),...document.querySelectorAll('button')].find(el=>el.getAttribute('aria-label')===name||el.textContent.replace(/\s/g,'')===name.replace(/\s/g,''));
async function click(name){assert(button(name),`Missing button: ${name}`);button(name).click();await new Promise(requestAnimationFrame);}
async function input(name,value){const el=document.querySelector(`input[aria-label="${name}"]`);assert(el,`Missing input: ${name}`);el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));await new Promise(requestAnimationFrame);}
const dialog=()=>document.querySelector('[role="dialog"][data-state="open"]');
const tab=id=>button(`Open request tab ${id}: ${id===1?'Saved request':'Untitled'}`);
const close=id=>click(`Close request tab ${id}: ${id===1?'Saved request':'Untitled'}`);
if (!new URLSearchParams(location.search).has('manual')) {
try {
 await until(()=>tab(1));
 await click('New request');await input('Request URL','https://api.example.com/temporary');await close(2);
 assert(dialog()?.getAttribute('aria-label')==='Save changes before closing?','Edited untitled asks before closing');
 await click('Cancel');assert(tab(2),'Cancel keeps tab');
 await input('Request URL','https://api.example.com/temporary');await close(2);await click('Save');
 assert(dialog()?.getAttribute('aria-label')==='Save request','Untitled asks where to save');
 await click('Cancel');assert(tab(2),'Cancelling destination keeps tab');
 await click('Save');assert(dialog()?.getAttribute('aria-label')==='Save request','Regular Save still opens destination');await click('Cancel');assert(tab(2),'Cancel resets pending close');
 await close(2);await click('Save');await input('Request name','Rejected');await click('Save request');
 assert(dialog()?.textContent.includes('That filename already exists.'),'Failed first save stays in modal');assert(tab(2),'Failed save keeps tab');
 await input('Request name','Created');await click('Save request');await until(()=>!dialog());
 assert(!tab(2),'First save closes tab');assert(documents['Created.yml'].http.url==='https://api.example.com/temporary','First save preserves draft');
 await input('Request URL','https://api.example.com/updated');await click('New request');await input('Request URL','https://api.example.com/other');await close(1);await click('Save');await until(()=>!dialog());
 assert(!tab(1),'Inactive edited saved tab closes after saving');assert(documents['saved.yml'].http.url.endsWith('/updated'),'Saved request uses existing file');assert(tab(3),'Other tab remains');
 await click('GET Saved request');await input('Request URL','https://api.example.com/failure');failSave=true;await click('Close request tab 4: Saved request');await click('Save');
 assert(dialog()?.textContent.includes('Disk is temporarily unavailable.'),'Save failure remains visible in close modal');assert(button('Open request tab 4: Saved request'),'Save failure keeps tab');
 assert(documents['saved.yml'].http.url.endsWith('/updated'),'Failure leaves stored request unchanged');await click('Cancel');
 await click('Close request tab 4: Saved request');const previousWrites=writes;await click('Close without saving');await until(()=>!dialog());
 assert(!button('Open request tab 4: Saved request'),'Discard closes tab');assert(writes===previousWrites,'Discard does not write');
 await close(3);await click('Close without saving');await until(()=>!dialog());
 await click('GET Saved request');await click('Close request tab 5: Saved request');assert(!dialog(),'Clean saved tab closes directly');
 await click('GET Saved request');
 async function editName(value,key='Enter'){button('Edit request name').dispatchEvent(new MouseEvent('dblclick',{bubbles:true}));await new Promise(requestAnimationFrame);await input('Edit request name',value);document.querySelector('.request-name-input').dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true}));await new Promise(requestAnimationFrame);}
 await editName('Cancelled name','Escape');assert(button('Open request tab 6: Saved request'),'Escape keeps original name');
 await editName('   ');assert(button('Open request tab 6: Saved request'),'Empty name preserves original');
 await editName('  Renamed request  ');assert(button('Open request tab 6: Renamed request'),'Confirmed name updates tab');assert(documents['saved.yml'].info.name==='Saved request','Rename stays in draft before Save');
 await click('Save');assert(documents['saved.yml'].info.name==='Renamed request','Save updates name in current file');assert(collection.requests.includes('saved.yml'),'Breadcrumb rename keeps file path');
 assert(button('Save').querySelector('.action-confirmation'),'Save confirms with a check icon');
 assert(document.querySelector('.request-save-notice').classList.contains('sr-only'),'Save announcement does not add visible text');
 await until(()=>!button('Save').querySelector('.action-confirmation'));
 await input('Request URL','https://api.example.com/discarded');await click('Discard changes');
 assert(button('Discard changes')?.querySelector('.action-confirmation'),'Reload confirms with a check in the same button');
 await until(()=>!button('Discard changes'));
 assert(documents['saved.yml'].http.url.endsWith('/updated'),'Reload discards the edit without writing it');
 await click('Variables');assert(document.querySelector('input[aria-label="variables name 1"]'),'Variables starts with one empty row');assert(!button('Add variable'),'Request variables has no Add button');
 await input('variables value 1','25');assert(document.querySelector('input[aria-label="variables name 2"]'),'Value-first editing appends a blank row');
 await input('variables name 1','limit');await input('variables name 2','temporary');assert(document.querySelector('input[aria-label="variables name 3"]'),'Each new variable leaves another blank row');
 await click('Remove variables row 2');await click('Save');assert(JSON.stringify(documents['saved.yml'].runtime.variables)===JSON.stringify([{name:'limit',value:'25'}]),`Save excludes the virtual empty row and removed variable: ${JSON.stringify(documents['saved.yml'].runtime.variables)}`);
 await input('variables name 2','');assert(button('Save').disabled,'Untouched empty row does not dirty saved request');
 // Exercise shadcn controls through the real editor and persisted draft.
 async function select(name,value){button(name).dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));await until(()=>document.querySelector('[role="option"]'));const option=[...document.querySelectorAll('[role="option"]')].find(el=>el.textContent.trim()===value);assert(option,`Missing option ${value}`);option.dispatchEvent(new PointerEvent('pointerup',{pointerType:'mouse',button:0,bubbles:true}));await new Promise(requestAnimationFrame);}
 await select('HTTP method','POST');assert(button('HTTP method').dataset.slot==='select-trigger','HTTP method uses shadcn Select');
 await click('Body');await select('Body type','json');const requestBody=document.querySelector('textarea[aria-label="Request body"]');requestBody.value='{"hello":true}';requestBody.dispatchEvent(new Event('input',{bubbles:true}));await new Promise(requestAnimationFrame);
 await click('Auth');await select('Authentication type','API Key');await select('API key placement','Query');await input('Auth key','access');await input('Auth value','{{apiKey}}');
 await click('Headers');await input('headers name 1','X-Test');await input('headers value 1','enabled');await click('Enable headers row 1');assert(button('Enable headers row 1').dataset.slot==='checkbox','Enabled uses shadcn Checkbox');
 await click('Save');assert(documents['saved.yml'].http.method==='POST','Method selection is saved');assert(documents['saved.yml'].http.body.data==='{"hello":true}','Body type and content are saved');assert(documents['saved.yml'].http.auth.placement==='query'&&documents['saved.yml'].http.auth.key==='access','Auth and placement are saved');assert(documents['saved.yml'].http.headers[0].disabled===true,'Checkbox saves disabled state');
 assert(!document.querySelector('.request-content select'),'Request selectors are shadcn');assert(document.querySelector('.rows-table table').dataset.slot==='table','Request rows use shadcn Table');
 await click('New request');await editName('New named request');await click('Save');assert(document.querySelector('input[aria-label="Request name"]').value==='New named request','First Save prefills edited name');await click('Cancel');
 // Fresh tabs close directly, whether active or inactive; changed tabs retain protection.
 await click('Close request tab 7: New named request');assert(dialog()?.getAttribute('aria-label')==='Save changes before closing?','Renaming alone asks before closing');await click('Cancel');
 await click('New request');assert(!tab(8).querySelector('.request-dirty'),'Untouched new tab has no unsaved indicator');await close(8);await until(()=>!tab(8));assert(!dialog(),'Untouched active tab closes without prompting');
 await click('New request');await click('New request');await close(9);await until(()=>!tab(9));assert(!dialog()&&tab(10),'Untouched inactive tab closes without prompting');await close(10);await until(()=>!tab(10));assert(button('Open request tab 7: New named request'),'Closing blank tabs preserves the edited request');
 await click('New request');await select('HTTP method','POST');await close(11);assert(dialog()?.getAttribute('aria-label')==='Save changes before closing?','Method changes count as unsaved information');await click('Cancel');await click('Discard changes');await close(11);await until(()=>!tab(11));assert(!dialog(),'Discard returns untitled to a fresh tab that closes directly');
 document.body.insertAdjacentHTML('beforeend','<output id="close-tabs-result" style="position:fixed;bottom:28px;right:12px;color:#10b981">PASS: close-tab regression checks</output>');
} catch(error){document.body.insertAdjacentHTML('beforeend','<output id="close-tabs-result" style="position:fixed;bottom:28px;right:12px;color:#f87171"></output>');document.querySelector('#close-tabs-result').textContent=`FAIL: ${error.message}`;console.error(error);}
}
</script></html>
