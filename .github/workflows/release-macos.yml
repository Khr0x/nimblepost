name: macOS ALPHA release

on:
  push:
    tags: ['v*-alpha.*']

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Pre-release checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build macOS and prepare draft
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.96.1'
      # Ad-hoc signing requires no Apple certificate or notarization credentials.
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Validate release tag
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          const prefix = `v${version}-alpha.`;
          if (!tag?.startsWith(prefix) || !/^\d+$/.test(tag.slice(prefix.length))) {
            throw new Error(`Expected ${prefix}<number>, received ${tag}`);
          }
          JS

      - name: Install Rust and both macOS targets
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-macos-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload draft prerelease
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          args: --target universal-apple-darwin --bundles app,dmg --ci -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: NimblePost ${{ github.ref_name }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: false
          releaseBody: |
            Early ALPHA of NimblePost for macOS (Apple Silicon and Intel).

            Download the DMG, open it and drag NimblePost into Applications.

            This build uses an ad-hoc signature. It is not signed with an Apple
            Developer ID certificate and is not notarized. On first launch,
            macOS may block the app. If you trust this download, open System
            Settings → Privacy & Security → Open Anyway after attempting to
            launch NimblePost.

            Instructions: https://support.apple.com/en-us/102445

            Request drafts are not restored after restarting the app. Windows
            and Linux installers are not included in this release.

      - name: Verify universal app signature and disk image
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/NimblePost.app
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo "$app/Contents/MacOS/NimblePost" -verify_arch arm64 x86_64
          for image in target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$image"
          done
