<!doctype html><html lang="en"><meta charset="UTF-8"><div id="app"></div><script type="module">
// Vite browser regression: http://127.0.0.1:1420/tests/ui/response-panel.html
// ?manual leaves the app available for checking format controls and themes.
import { mockIPC } from '@tauri-apps/api/mocks';
const collection={name:'Team API',root:'/tmp/response-panel-test',requests:['users.yml'],folders:[],environments:[],readOnly:false};
const request={name:'List users',method:'GET',url:'https://api.example.com/users',revision:1,document:{info:{name:'List users',type:'http'},http:{method:'GET',url:'https://api.example.com/users'}},diagnostics:[]};
const raw='{"id":9007199254740993123,"name":"María","score":98.5,"active":true,"lastLogin":null,"roles":["admin","developer"],"profile":{"team":{"name":"Nimble"},"active":true}}';
let currentBytes=new Uint8Array(),id=0,finishSend;
let copied='',failCopy=false;
if(!new URLSearchParams(location.search).has('manual'))Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async text=>{if(failCopy)throw new Error('Clipboard denied');copied=text;}}});
mockIPC((cmd,args)=>{
 if(cmd==='read_workspace')return {workspaces:[{id:1,name:'My Workspace'}],activeWorkspaceId:1,activeCollection:collection.root,collections:[collection],warning:null};
 if(cmd==='read_history')return {entries:[],warning:null};
 if(cmd==='read_request_summaries')return {'users.yml':{name:request.name,method:'GET'}};
 if(cmd==='read_request')return JSON.parse(JSON.stringify(request));
 if(cmd==='send_request'){
  const route=args.input.url.split('/').at(-1);
  if(route==='network-error')throw new Error('Could not connect to the server.');
  const binary=route==='binary';
  const body=route==='unsafe'?'{"html":"<img src=x onerror=alert(1)>","script":"<script>alert(1)<\/script>"}':route==='large'?'{"text":"'+'a'.repeat(70000)+'"}':route==='invalid'?'{"incomplete":':route==='plain'?'<h1>Plain text</h1>':route==='empty'?'':raw;
  currentBytes=binary?Uint8Array.from([255,0,254,1]):new TextEncoder().encode(body);
  const response={id:++id,status:route==='error'?500:route==='empty'?204:200,headers:[{name:'content-type',value:binary?'application/octet-stream':route==='plain'?'text/html; charset=utf-8':'application/json; charset=utf-8'},{name:'x-request-id',value:'req-demo-42'}],bodyBytes:currentBytes.length,elapsedMs:128,text:!binary,historyWarning:null};
  if(new URLSearchParams(location.search).has('manual'))return new Promise(resolve=>setTimeout(()=>resolve(response),80));
  return new Promise(resolve=>finishSend=()=>resolve(response));
 }
 if(cmd==='read_response')return btoa(String.fromCharCode(...currentBytes.slice(args.offset,args.offset+65536)));
 throw new Error(`Unexpected command ${cmd}`);
});
await import('/src/main.ts');
const assert=(condition,message)=>{if(!condition)throw new Error(message);};
async function until(predicate){const deadline=Date.now()+5000;while(!predicate()){if(Date.now()>deadline)throw new Error('UI did not reach expected state');await new Promise(requestAnimationFrame);}}
const button=name=>[...document.querySelectorAll('button')].find(el=>el.getAttribute('aria-label')===name||el.textContent.trim()===name);
async function click(name){assert(button(name),`Missing button: ${name}`);button(name).click();await new Promise(requestAnimationFrame);}
async function send(route){const input=document.querySelector('input[aria-label="Request URL"]');input.value=`https://api.example.com/${route}`;input.dispatchEvent(new Event('input',{bubbles:true}));await new Promise(requestAnimationFrame);await click('Send');}
if(!new URLSearchParams(location.search).has('manual')){
 const savedHeight=localStorage.getItem('nimblepost.responseHeight');
 try {
  await until(()=>button('Send')&&!button('Send').disabled);
  assert(!document.querySelector('[aria-label="Response"]'),'Response is hidden before first Send');
  await click('Send');assert(!document.querySelector('[aria-label="Response"]'),'Response stays hidden while sending');finishSend();
  await until(()=>document.querySelector('.response-json'));
  const splitter=document.querySelector('[aria-label="Resize response panel"]'),pane=document.querySelector('#response-pane');
  const resizeKey=async key=>{splitter.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true}));await new Promise(requestAnimationFrame);};
  await resizeKey('Home');assert(pane.clientHeight===Number(splitter.getAttribute('aria-valuemin')),'Response can shrink to its minimum');
  await resizeKey('End');assert(pane.clientHeight===Number(splitter.getAttribute('aria-valuemax')),'Response can grow to its maximum');
  const maximum=pane.clientHeight;
  await resizeKey('ArrowDown');assert(pane.clientHeight===maximum-16,'Keyboard reduces Response height');
  await resizeKey('ArrowUp');assert(pane.clientHeight===maximum,'Keyboard expands Response height');
  assert(document.querySelector('.request-inputs').clientHeight>=200,'The request editor retains usable space');
  assert(document.querySelector('main').scrollHeight===document.querySelector('main').clientHeight,'Request and Response scroll independently inside the workbench');
  splitter.dispatchEvent(new MouseEvent('dblclick',{bubbles:true}));await new Promise(requestAnimationFrame);
  const resetHeight=pane.clientHeight;assert(resetHeight===Math.min(320,maximum),'Double click resets Response height');
  assert(document.querySelector('[aria-label="Response body"]').textContent.includes('9007199254740993123'),'Pretty preserves large numeric IDs');
  assert(button('Response body format').textContent.includes('JSON'),'JSON is default');
  for(const type of ['key','string','number','boolean','null','punctuation'])assert(document.querySelector(`[aria-label="Response body"] .json-${type}`),`Pretty highlights ${type}`);
  assert(document.querySelector('[aria-label="Response body"]').textContent.includes('"lastLogin": null'),'Highlighting preserves body text');
  const folds=[...document.querySelectorAll('.json-fold')],root=folds[0];
  const roles=folds.find(node=>node.querySelector('[data-slot=collapsible-trigger]').getAttribute('aria-label').includes('array roles'));
  roles.querySelector('[data-slot=collapsible-trigger]').click();await new Promise(requestAnimationFrame);assert(roles.dataset.state==='closed','Nested array can collapse independently');
  root.querySelector('[data-slot=collapsible-trigger]').click();await new Promise(requestAnimationFrame);assert(root.dataset.state==='closed','Root object can collapse');
  const copyWidth=button('Copy response body').getBoundingClientRect().width;
  await click('Copy response body');
  assert(copied.includes('9007199254740993123')&&copied.includes('"admin"')&&copied.includes('"Nimble"')&&!copied.includes('…'),'Copy includes all folded data and preserves numeric precision');
  assert(JSON.parse(copied).profile.team.name==='Nimble','Copied folded body is valid JSON');
  assert(button('Copy response body').querySelector('.action-confirmation'),'Copy success swaps the icon to a check');
  assert(!document.querySelector('.response-copy-message'),'Successful copy adds no visible message');
  assert(button('Copy response body').getBoundingClientRect().width===copyWidth,'Copy feedback keeps the button size');
  await until(()=>!button('Copy response body').querySelector('.action-confirmation'));
  failCopy=true;await click('Copy response body');failCopy=false;
  assert(document.querySelector('.response-copy-message[role="alert"]')?.textContent.includes('Could not copy'),'Copy errors stay visible');
  assert(!button('Copy response body').querySelector('.action-confirmation'),'Failed copy does not show success');
  root.querySelector('[data-slot=collapsible-trigger]').click();await new Promise(requestAnimationFrame);assert(root.dataset.state==='open'&&roles.dataset.state==='closed','Root expands while preserving nested folded state');
  await click('Wrap response lines');assert(roles.dataset.state==='closed','Wrap does not reset folded state');
  roles.querySelector('[data-slot=collapsible-trigger]').click();await new Promise(requestAnimationFrame);assert(roles.dataset.state==='open','Nested array can expand again');
  await send('unsafe');finishSend();await until(()=>document.querySelector('[aria-label="Response body"]')?.textContent.includes('<img'));
  assert(document.querySelector('#response-pane').clientHeight===resetHeight,'Response height survives a new response');
  assert(!document.querySelector('[aria-label="Response body"] img, [aria-label="Response body"] script'),'Server-provided HTML is escaped, never executed');
  await send('large');finishSend();await until(()=>button('Load next 64 KB'));
  assert(button('Copy response body').disabled,'Partial body cannot be copied as a complete response');
  assert(button('Response body format').textContent.includes('Text'),'Partial JSON remains original text');
  await click('Load next 64 KB');await until(()=>!button('Load next 64 KB'));
  assert(button('Response body format').textContent.includes('JSON'),'Complete JSON becomes Pretty automatically');
  await send('invalid');finishSend();await until(()=>document.querySelector('[aria-label="Response body"]')?.textContent==='{"incomplete":');
  assert(document.body.textContent.includes('not valid JSON'),'Malformed JSON has explicit fallback');
  await send('empty');finishSend();await until(()=>document.querySelector('[aria-label="Response body"]')?.textContent==='(empty body)');
  await send('binary');finishSend();await until(()=>document.querySelector('[aria-label="Response body"]')?.textContent.includes('ff 00 fe 01'));
  assert(button('Response body format').textContent.includes('Hex'),'Binary is labeled as hex');
  await send('error');finishSend();await until(()=>document.querySelector('.status')?.textContent==='500');assert(document.querySelector('[aria-label="Response"]'),'HTTP errors retain response');
  await send('network-error');await until(()=>document.querySelector('[role="alert"]'));
  assert(!document.querySelector('[aria-label="Response"]'),'Transport failure does not fabricate response');
  document.body.insertAdjacentHTML('beforeend','<output id="response-result" style="position:fixed;bottom:28px;right:12px;color:#10b981">PASS: response panel regression checks</output>');
 }catch(error){document.body.insertAdjacentHTML('beforeend','<output id="response-result" style="position:fixed;bottom:28px;right:12px;color:#f87171"></output>');document.querySelector('#response-result').textContent=`FAIL: ${error.message}`;console.error(error);}
 finally{if(savedHeight===null)localStorage.removeItem('nimblepost.responseHeight');else localStorage.setItem('nimblepost.responseHeight',savedHeight);}
}
</script></html>
