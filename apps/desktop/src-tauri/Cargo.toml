[package]
name = "nimblepost-desktop"
default-run = "NimblePost"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nimblepost_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "NimblePost"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]
native-validation = []
native-inspector = ["native-validation", "tauri/devtools"]

[dependencies]
base64.workspace = true
nimblepost-core = { path = "../../../crates/core" }
notify = "=8.2.0"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
tokio.workspace = true
tempfile.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }
