# Este comentario y el quoting se deben conservar al editar otro campo.
info:
  name: List Users
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/users"
  headers:
    - name: X-Example
      value: 'preserve this quoting'
      disabled: true
  params:
    - name: limit
      value: "{{pageSize}}"
      type: query
runtime:
  variables:
    - name: pageSize
      value:
        type: string
        data: "5"
settings:
  timeout: inherit
docs: |
  Ejemplo de precedencia: petición (5) sobre carpeta (10).
