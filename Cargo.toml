[workspace]
members = ["crates/core", "bins/cli", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.1-alpha.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive"] }
jsonschema = { version = "=0.58.2", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util", "net", "sync"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
yaml-rust2 = { version = "=0.13.0", default-features = false }
yaml-edit = "=0.3.2"
tempfile = "3"
