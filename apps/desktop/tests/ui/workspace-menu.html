<!doctype html><html lang="en"><meta charset="UTF-8"><div id="app"></div><script type="module">
// Vite regression: /tests/ui/workspace-menu.html (?manual for visual checks).
// Workspace persistence is mocked in memory; no user files are touched.
import { mockIPC } from '@tauri-apps/api/mocks';
let spaces=[{id:1,name:'My Workspace'},{id:2,name:'hemia-labs'},{id:3,name:'Sandbox'}],active=1,nextId=3,selectCalls=0,failDelete=false;
const view=()=>({workspaces:structuredClone(spaces),activeWorkspaceId:active,collections:[],activeCollection:null,warning:null});
mockIPC((cmd,args)=>{
 if(cmd==='read_workspace')return view();
 if(cmd==='read_history')return {entries:[],warning:null};
 if(cmd==='select_workspace'){selectCalls++;active=args.id;return view();}
 if(cmd==='rename_workspace'||cmd==='create_workspace'){
  const name=args.name.trim();if(!name||spaces.some(item=>item.id!==args.id&&item.name.toLowerCase()===name.toLowerCase()))throw new Error('A workspace with this name already exists');
  if(cmd==='rename_workspace')spaces.find(item=>item.id===args.id).name=name;
  else {active=++nextId;spaces.push({id:active,name});}return view();
 }
 if(cmd==='remove_workspace'){
  if(failDelete){failDelete=false;throw new Error('Workspace storage is unavailable.');}
  spaces=spaces.filter(item=>item.id!==args.id);if(active===args.id){const fallback=spaces.find(item=>item.name==='My Workspace')??spaces.find(item=>item.id===1);if(fallback)active=fallback.id;else{spaces.unshift({id:1,name:'My Workspace'});active=1;}}return view();
 }
 throw new Error(`Unexpected command: ${cmd}`);
});
await import('/src/main.ts');
const assert=(condition,message)=>{if(!condition)throw new Error(message);};
async function until(predicate){const deadline=Date.now()+5000;while(!predicate()){if(Date.now()>deadline)throw new Error('Timed out waiting for UI');await new Promise(requestAnimationFrame);}}
const visibleDialog=()=>document.querySelector('[role="dialog"][data-state="open"]');
const button=name=>[...document.querySelectorAll('[role="dialog"][data-state="open"] button'),...document.querySelectorAll('button')].find(el=>el.getAttribute('aria-label')===name||el.textContent.trim()===name);
async function click(name){assert(button(name),`Missing button ${name}`);button(name).click();await new Promise(requestAnimationFrame);}
async function input(name,value){const el=document.querySelector(`input[aria-label="${name}"]`);assert(el,`Missing input ${name}`);el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));await new Promise(requestAnimationFrame);}
async function menuItem(name){const el=[...document.querySelectorAll('[role="menuitem"],[role="menuitemradio"]')].find(el=>el.textContent.trim()===name);assert(el,`Missing menu item ${name}`);el.click();await new Promise(requestAnimationFrame);}
async function openMenu(){await click('Workspace');await until(()=>document.querySelector('[role="menuitemradio"]'));}
const managerView=()=>document.querySelector('.workspace-manager');
async function manage(){await openMenu();await menuItem('Manage workspaces');await manager();assert(!visibleDialog()&&!document.querySelector('[data-slot=dialog-overlay]'),'Manage workspaces is a main-area view without an overlay');}
async function manager(){await until(()=>managerView()&&!visibleDialog());}
if(!new URLSearchParams(location.search).has('manual'))try{
 await until(()=>button('Workspace')&&!button('Workspace').disabled);
 await openMenu();assert(document.querySelector('[role="menuitemradio"][aria-checked="true"]').textContent.trim()==='My Workspace','Menu marks current workspace');assert(!button('New workspace')&&!button('Workspace actions'),'Navbar has one workspace menu');
 await menuItem('hemia-labs');await until(()=>button('Workspace').textContent.trim()==='hemia-labs');assert(active===2,'Selecting workspace persists active ID');
 await manage();assert(document.querySelectorAll('.workspace-manager-row').length===3,'Manager lists every workspace');
 await click('Rename workspace Sandbox');await until(()=>visibleDialog()?.getAttribute('aria-label')==='Rename workspace');assert(document.activeElement?.getAttribute('aria-label')==='Workspace name','Rename focuses the name');
 await input('Workspace name','hemia-labs');await click('Save name');assert(visibleDialog().textContent.includes('already exists'),'Duplicate rename reports an error');assert(spaces.find(item=>item.id===3).name==='Sandbox','Failed rename keeps stored name');
 await input('Workspace name','Experiments');await click('Save name');await manager();assert(button('Rename workspace Experiments'),'Manager updates renamed inactive workspace');assert(active===2&&button('Workspace').textContent.trim()==='hemia-labs','Inactive rename keeps active workspace');
 await click('Delete workspace Experiments');await click('Cancel');await manager();assert(spaces.some(item=>item.id===3),'Cancel preserves workspace');
 await click('Delete workspace Experiments');failDelete=true;await click('Delete workspace');assert(visibleDialog().textContent.includes('storage is unavailable'),'Deletion failure remains visible');assert(spaces.some(item=>item.id===3),'Failed delete preserves workspace');await click('Delete workspace');await manager();assert(!spaces.some(item=>item.id===3)&&active===2,'Inactive deletion leaves selection alone');
 await click('Delete workspace hemia-labs');await click('Delete workspace');await manager();assert(active===1&&button('Workspace').textContent.trim()==='My Workspace','Deleting active workspace selects default');
 await click('Back to workspace');await openMenu();await menuItem('Create workspace');await until(()=>visibleDialog()?.getAttribute('aria-label')==='New workspace');assert(document.activeElement?.getAttribute('aria-label')==='Workspace name','Create focuses the name');await input('Workspace name','Client APIs');await click('Create workspace');await until(()=>!visibleDialog());assert(button('Workspace').textContent.trim()==='Client APIs','Create selects new workspace');
 await manage();await click('Delete workspace My Workspace');await click('Delete workspace');await manager();assert(active===4,'Removing inactive default retains active workspace');await click('Delete workspace Client APIs');await click('Delete workspace');await manager();assert(spaces.length===1&&spaces[0].name==='My Workspace'&&active===1,'Removing last workspace restores default');await click('Back to workspace');
 await openMenu();await menuItem('Create workspace');await input('Workspace name','Pending switch');await click('Create workspace');await until(()=>!visibleDialog());await openMenu();await menuItem('My Workspace');await until(()=>active===1);
 await click('New request');await input('Request URL','https://api.example.com/unsaved');await click('Variables');await openMenu();const before=selectCalls;await menuItem('Pending switch');assert(active===1&&selectCalls===before,'Unsaved request blocks workspace switching');await openMenu();assert(document.querySelector('[role="menuitemradio"][aria-checked="true"]').textContent.trim()==='My Workspace','Blocked switching restores the selected check');await menuItem('Create workspace');assert(!visibleDialog()&&selectCalls===before,'Pending request blocks workspace creation');await manage();await click('Delete workspace My Workspace');assert(!visibleDialog()&&managerView().textContent.includes('unsaved'),'Pending request blocks destructive workspace actions with a visible message');await click('Back to workspace');assert(document.querySelector('[aria-label="Request URL"]').value==='https://api.example.com/unsaved','Returning preserves the unsaved request');assert(button('Variables').getAttribute('aria-selected')==='true','Returning preserves the editor tab');
 document.body.insertAdjacentHTML('beforeend','<output id="workspace-result" style="position:fixed;bottom:28px;right:12px;color:#10b981">PASS: workspace menu regression checks</output>');
}catch(error){document.body.insertAdjacentHTML('beforeend','<output id="workspace-result" style="position:fixed;bottom:28px;right:12px;color:#f87171"></output>');document.querySelector('#workspace-result').textContent=`FAIL: ${error.message}`;console.error(error);}
</script></html>
