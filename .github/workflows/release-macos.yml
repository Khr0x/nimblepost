name: macOS ALPHA release

on:
  workflow_call:
    inputs:
      version:
        description: Version generated by Changesets and merged through the release PR
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build, verify and publish macOS ALPHA
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.96.1'
      RELEASE_VERSION: ${{ inputs.version }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version and prepare changelog notes
        run: node scripts/changesets.mjs notes "$RELEASE_VERSION" "$RUNNER_TEMP/nimblepost-release-notes.md"

      - name: Install Rust and both macOS targets
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-macos-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - name: Build universal app and disk image
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          args: --target universal-apple-darwin --bundles app,dmg --ci -- --locked

      - name: Verify universal app signature and disk image
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/NimblePost.app
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo "$app/Contents/MacOS/NimblePost" -verify_arch arm64 x86_64
          for image in target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$image"
          done

      - name: Create tag and publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$RELEASE_VERSION"
          notes="$RUNNER_TEMP/nimblepost-release-notes.md"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha > "$RUNNER_TEMP/nimblepost-tag-sha"; then
            if [ "$(cat "$RUNNER_TEMP/nimblepost-tag-sha")" != "$GITHUB_SHA" ]; then
              printf 'Existing tag %s points to a different commit.\n' "$tag" >&2
              exit 1
            fi
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > "$RUNNER_TEMP/nimblepost-is-draft"; then
            if [ "$(cat "$RUNNER_TEMP/nimblepost-is-draft")" != 'true' ]; then
              printf 'Already published: %s\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            draft_commit=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
            if [ "$draft_commit" != "$GITHUB_SHA" ]; then
              printf 'Existing draft %s targets a different commit.\n' "$tag" >&2
              exit 1
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "NimblePost $tag" --notes-file "$notes" --draft --prerelease
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false \
            --prerelease --latest=false --notes-file "$notes"
